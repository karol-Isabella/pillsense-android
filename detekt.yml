build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 1
    LongMethod: 1
    LargeClass: 1
    DataClassContainsFunctions: 1
    DataClassShouldBeImmutable: 1
    EqualsAlwaysReturnsTrueOrFalse: 3
    EqualsWithHashCodeExternalizable: 1
    NestedBlockDepth: 1
    StringLiteralDuplication: 1
    TooManyFunctions: 1
    TooGenericExceptionCaught: 1
    TooGenericExceptionThrown: 1

config:
  validation: true
  warningThreshold: 5
  failThreshold: 10
  excludeFromBaseline: []

processors:
  active: true
  exclude:
    - 'DetektProgressListener'
  include: []

console-reports:
  active: true

output-reports:
  active: true

comments:
  active: true
  excludes: []
